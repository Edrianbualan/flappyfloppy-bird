<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FLOPPY FLAPPY BIRD</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
    :root { --primary:#00f5ff; --accent:#ff2eff; }
    body {
        overflow:hidden;
        background:#0a0a1f;
        height:100vh;
        color:white;
        touch-action: none;
    }
    canvas { position:absolute; top:0; left:0; width:100%; height:100%; image-rendering: crisp-edges; }
    .screen {
        position:absolute; inset:0;
        display:flex; flex-direction:column;
        justify-content:center; align-items:center;
        gap:28px;
        background:radial-gradient(circle at center, rgba(20,25,60,0.95), rgba(5,8,25,0.98));
        z-index:30;
        transition: all 0.5s cubic-bezier(0.23,1,0.32,1);
    }
    .hidden { opacity:0; pointer-events:none; }
    .logo-container { text-align:center; margin-bottom:10px; }
    .floppy {
        font-size:6.2rem; font-weight:900; letter-spacing:-4px;
        background:linear-gradient(90deg, #00f5ff, #a855f7, #00f5ff);
        -webkit-background-clip:text; -webkit-text-fill-color:transparent;
        text-shadow:0 0 40px rgba(0,245,255,0.8), 0 0 80px rgba(168,85,247,0.6);
        animation:logoFloat 3.5s ease-in-out infinite;
    }
    .gradient-bar {
        height:18px; width:420px; max-width:85vw;
        background:linear-gradient(90deg, #ff00cc, #00f5ff, #7b5eff);
        border-radius:9999px; margin:8px auto;
        box-shadow:0 0 25px rgba(0,245,255,0.9), 0 0 50px rgba(255,0,204,0.6);
    }
    .premium-text {
        font-size:1.15rem; letter-spacing:6px; font-weight:700; opacity:0.9;
        background:linear-gradient(90deg, #aaa, #fff, #aaa);
        -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    @keyframes logoFloat { 0%,100%{transform:translateY(0) rotate(-1deg);} 50%{transform:translateY(-22px) rotate(1deg);} }
    .btn {
        border:none; padding:18px 48px; border-radius:9999px;
        font-size:1.3rem; font-weight:700; cursor:pointer;
        background:linear-gradient(90deg, #00f5ff, #7b5eff, #a855f7);
        color:white; transition:all .3s cubic-bezier(0.4,0,0.2,1);
        box-shadow:0 10px 30px rgba(0,245,255,0.5), inset 0 2px 4px rgba(255,255,255,0.3);
        min-width:280px; position:relative; overflow:hidden;
    }
    .btn::before {
        content:''; position:absolute; inset:0;
        background:linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
        transform:translateX(-200%); transition:transform 0.7s;
    }
    .btn:hover::before { transform:translateX(300%); }
    .btn:hover { transform:translateY(-8px) scale(1.05); box-shadow:0 20px 45px rgba(0,245,255,0.7); }
    .btn:active { transform:scale(0.95); }
    .panel {
        width:min(460px,92%); background:rgba(255,255,255,0.06);
        padding:32px; border-radius:32px;
        backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,0.15);
        box-shadow:0 15px 50px rgba(0,0,0,0.7);
    }
    .topbar { position:absolute; top:18px; left:0; right:0; display:flex; justify-content:center; z-index:40; pointer-events:none; }
    .scoreBox {
        background:rgba(10,15,40,0.8); padding:12px 36px;
        border-radius:9999px; font-size:2rem; font-weight:800;
        backdrop-filter:blur(12px); border:1px solid rgba(0,245,255,0.3);
    }
    .gameoverTitle {
        font-size:4.2rem; font-weight:900;
        background:linear-gradient(45deg, #ff3366, #ff88aa);
        -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .achievement-popup {
        position:absolute; top:90px; left:50%; transform:translateX(-50%);
        background:linear-gradient(90deg, #22ff88, #00cc66); color:#000;
        padding:14px 34px; border-radius:9999px;
        font-weight:700; font-size:1.1rem;
        box-shadow:0 12px 40px rgba(34,255,136,0.6);
        z-index:100; opacity:0; transition:all .5s;
        white-space:nowrap;
    }
    .stat-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(255,255,255,0.1); }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="topbar">
    <div class="scoreBox">SCORE <span id="score">0</span></div>
</div>
<!-- HOME -->
<div id="homeScreen" class="screen">
    <div class="logo-container">
        <div class="floppy">FLOPPY</div>
        <div class="gradient-bar"></div>
        <div class="premium-text">PREMIUM</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:18px;">
        <button class="btn" id="startBtn">START GAME</button>
        <button class="btn" id="settingsBtn">SETTINGS</button>
        <button class="btn" id="achievementsBtn">ACHIEVEMENTS</button>
        <button class="btn" id="statsBtn">STATISTICS</button>
    </div>
</div>
<!-- SETTINGS -->
<div id="settingsScreen" class="screen hidden">
    <div class="panel">
        <h2 style="text-align:center;margin-bottom:24px;font-size:2rem;">SETTINGS</h2>
        <div style="display:flex;flex-direction:column;gap:20px;">
            <div><label>Sensitivity <span id="sensVal">1.0</span></label><input id="sensitivity" type="range" min="0.6" max="1.6" step="0.05" value="1"></div>
            <div><label>Brightness <span id="brightVal">100</span>%</label><input id="brightness" type="range" min="60" max="140" value="100"></div>
            <div><label>Volume <span id="volVal">80</span>%</label><input id="volume" type="range" min="0" max="100" value="80"></div>
            <div>
                <button class="btn" id="toggleMusic" style="width:100%;padding:14px;">🎵 MUSIC: ON</button>
            </div>
        </div>
        <button class="btn" id="settingsBackBtn" style="margin-top:30px;width:100%;">BACK TO MENU</button>
    </div>
</div>
<!-- ACHIEVEMENTS -->
<div id="achievementsScreen" class="screen hidden">
    <div class="panel">
        <h2 style="text-align:center;margin-bottom:20px;">ACHIEVEMENTS</h2>
        <div id="achievementsList" style="max-height:420px;overflow-y:auto;padding-right:10px;"></div>
        <button class="btn" id="achBackBtn" style="margin-top:24px;width:100%;">BACK</button>
    </div>
</div>
<!-- STATISTICS -->
<div id="statsScreen" class="screen hidden">
    <div class="panel">
        <h2 style="text-align:center;margin-bottom:20px;">STATISTICS</h2>
        <div id="statsContent" style="font-size:1.1rem;line-height:1.8;"></div>
        <button class="btn" id="statsBackBtn" style="margin-top:24px;width:100%;">BACK</button>
    </div>
</div>
<!-- GAME OVER -->
<div id="gameOverScreen" class="screen hidden">
    <div class="gameoverTitle">GAME OVER</div>
    <div id="finalScore" style="font-size:2.8rem;font-weight:800;margin:12px 0;">0</div>
    <div id="bestScore" style="font-size:1.5rem;opacity:0.85;">BEST: 0</div>
    <div style="margin:30px 0;width:100%;max-width:320px;">
        <div id="scoreBreakdown" style="background:rgba(255,255,255,0.08);border-radius:20px;padding:18px;"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px;width:min(320px,90%);">
        <button class="btn" id="restartBtn">RESTART</button>
        <button class="btn" id="homeBtn">MAIN MENU</button>
    </div>
</div>
<div id="achievementPopup" class="achievement-popup">🏆 ACHIEVEMENT UNLOCKED</div>
<script>
// ============== CORE ==============
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", { alpha: true });
let WIDTH = canvas.width = window.innerWidth;
let HEIGHT = canvas.height = window.innerHeight;
window.addEventListener("resize", () => {
    WIDTH = canvas.width = window.innerWidth;
    HEIGHT = canvas.height = window.innerHeight;
});
const scoreEl = document.getElementById("score");
const homeScreen = document.getElementById("homeScreen");
const settingsScreen = document.getElementById("settingsScreen");
const gameOverScreen = document.getElementById("gameOverScreen");
const achievementsScreen = document.getElementById("achievementsScreen");
const statsScreen = document.getElementById("statsScreen");
const finalScoreEl = document.getElementById("finalScore");
const bestScoreEl = document.getElementById("bestScore");
const achievementPopup = document.getElementById("achievementPopup");
// Variables
let score = 0, highScore = 0, gameRunning = false, particles = [], pipes = [], timeOfDay = 0.3, shake = 0;
let sensitivity = 1, brightness = 100, volume = 0.8, musicEnabled = true;
let stats = { gamesPlayed: 0, totalScore: 0, totalFlaps: 0, totalPipes: 0, playTime: 0, bestScore: 0 };
let musicStarted = false;
// Audio
const buttonSound = new Audio('button-home-page-sfx.mp3');
const jumpSound = new Audio('bird-jumping-sfx.mp3');
const gameOverSound = new Audio('game-over-sfx.mp3');
const bgMusic = new Audio('bg-music-sfx.mp3');
bgMusic.loop = true;
function playSound(audio) {
    if (!audio) return;
    audio.volume = volume;
    audio.currentTime = 0;
    audio.play().catch(() => {});
}
function playButton() { playSound(buttonSound); }
function playJump() { playSound(jumpSound); }
function playDeath() { playSound(gameOverSound); }
function startBackgroundMusic() {
    if (!musicEnabled || gameRunning || musicStarted) return;
    bgMusic.volume = volume * 0.65;
    bgMusic.play().then(() => {
        musicStarted = true;
        console.log("✅ Background music is now playing");
    }).catch(() => {});
}
function stopBackgroundMusic() {
    bgMusic.pause();
    bgMusic.currentTime = 0;
    musicStarted = false;
}
// Data Management
function loadData() {
    try {
        const savedAch = localStorage.getItem("ffbAchievements");
        if (savedAch) {
            const parsed = JSON.parse(savedAch);
            achievements.forEach(a => {
                const match = parsed.find(p => p.id === a.id);
                if (match) Object.assign(a, match);
            });
        }
        const savedStats = localStorage.getItem("ffbStats");
        if (savedStats) Object.assign(stats, JSON.parse(savedStats));
        const savedHigh = localStorage.getItem("ffbHigh");
        if (savedHigh) highScore = parseInt(savedHigh);
    } catch(e) {}
}
function saveData() {
    try {
        localStorage.setItem("ffbAchievements", JSON.stringify(achievements));
        localStorage.setItem("ffbStats", JSON.stringify(stats));
        localStorage.setItem("ffbHigh", highScore);
    } catch(e) {}
}
// Bird
const bird = { x:0, y:0, w:48, h:36, velocity:0, gravity:0.52, jump:-11.5, rotation:0, trail:[] };
function resetBird() {
    bird.x = WIDTH * 0.28;
    bird.y = HEIGHT * 0.42;
    bird.velocity = 0;
    bird.rotation = 0;
    bird.trail = [];
}
// Background
let clouds = [], mountains = [], stars = [];
function initBackground() {
    clouds = []; mountains = []; stars = [];
    for(let i=0; i<12; i++) clouds.push({x:Math.random()*WIDTH*1.8, y:80+Math.random()*220, size:0.7+Math.random()*1.1, speed:0.3+Math.random()*0.7});
    for(let i=0; i<5; i++) mountains.push({x:i*(WIDTH/3.5)-WIDTH*0.4, height:220+Math.random()*140});
    for(let i=0; i<80; i++) stars.push({x:Math.random()*WIDTH, y:Math.random()*HEIGHT*0.5, size:Math.random()*2.5+0.8, twinkle:Math.random()*Math.PI*2});
}
// Achievements
let achievements = [
    {id:"first", name:"First Flight", desc:"Flap your wings", unlocked:false},
    {id:"score10", name:"Rookie Flyer", desc:"Score 10", unlocked:false},
    {id:"score25", name:"Seasoned", desc:"Score 25", unlocked:false},
    {id:"score50", name:"Ace Pilot", desc:"Score 50", unlocked:false},
    {id:"score100", name:"Legend", desc:"Score 100", unlocked:false},
    {id:"score250", name:"Immortal", desc:"Score 250", unlocked:false},
    {id:"score500", name:"God Tier", desc:"Score 500", unlocked:false}
];
function unlockAchievement(id) {
    const ach = achievements.find(a => a.id === id);
    if (ach && !ach.unlocked) {
        ach.unlocked = true;
        showAchievementPopup(ach.name);
        saveData();
    }
}
function showAchievementPopup(text) {
    achievementPopup.textContent = `🏆 ${text}`;
    achievementPopup.style.opacity = "1";
    achievementPopup.style.transform = "translate(-50%, -30px)";
    setTimeout(() => {
        achievementPopup.style.opacity = "0";
        achievementPopup.style.transform = "translate(-50%, 40px)";
    }, 2600);
}
function renderAchievements() {
    const container = document.getElementById("achievementsList");
    container.innerHTML = "";
    achievements.forEach(ach => {
        const div = document.createElement("div");
        div.style.cssText = `padding:18px; margin:10px 0; border-radius:16px; background:rgba(255,255,255,0.07); border-left:5px solid ${ach.unlocked ? '#22ff88' : '#555'};`;
        div.innerHTML = `<strong>${ach.name}</strong><br><small style="opacity:0.8">${ach.desc}</small>`;
        container.appendChild(div);
    });
}
// Particle & Pipe
class Particle {
    constructor(x, y, hue) {
        this.x = x; this.y = y;
        this.vx = (Math.random()-0.5)*7;
        this.vy = (Math.random()-0.5)*7 - 2;
        this.life = 38;
        this.size = 4 + Math.random()*5;
        this.hue = hue;
        this.grav = 0.12;
    }
    update() {
        this.x += this.vx; this.y += this.vy; this.vy += this.grav;
        this.life--; this.size *= 0.98;
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = this.life / 38;
        ctx.fillStyle = `hsl(${this.hue}, 100%, 85%)`;
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.restore();
    }
}
function createBurst(x,y,count=24,hue=200) {
    for(let i=0;i<count;i++) particles.push(new Particle(x,y,hue));
}
class Pipe {
    constructor() {
        this.w = 88;
        this.gap = Math.max(210, HEIGHT * 0.34);
        this.x = WIDTH + 80;
        this.top = 80 + Math.random() * (HEIGHT * 0.42);
        this.passed = false;
    }
    update(speed) {
        this.x -= speed;
        if (!this.passed && this.x + this.w < bird.x) {
            this.passed = true;
            score++;
            scoreEl.textContent = score;
            createBurst(bird.x - 30, bird.y + 12, 18, 110);
            playJump();
            if (score === 10) unlockAchievement("score10");
            if (score === 25) unlockAchievement("score25");
            if (score === 50) unlockAchievement("score50");
            if (score === 100) unlockAchievement("score100");
            if (score === 250) unlockAchievement("score250");
            if (score === 500) unlockAchievement("score500");
        }
    }
    draw() {
        const bottomY = this.top + this.gap;
        const grad = ctx.createLinearGradient(this.x, 0, this.x+this.w, 0);
        grad.addColorStop(0, "#22c55e");
        grad.addColorStop(1, "#15803d");
        ctx.fillStyle = grad;
        ctx.fillRect(this.x, 0, this.w, this.top);
        ctx.fillRect(this.x, bottomY, this.w, HEIGHT - bottomY);
        ctx.fillStyle = "rgba(255,255,255,0.35)";
        ctx.fillRect(this.x+12, 0, 18, this.top);
        ctx.fillRect(this.x+12, bottomY, 18, HEIGHT - bottomY);
    }
    collides() {
        const bottomY = this.top + this.gap;
        return bird.x + bird.w*0.8 > this.x && bird.x + bird.w*0.2 < this.x + this.w &&
               (bird.y + bird.h*0.2 < this.top || bird.y + bird.h*0.8 > bottomY);
    }
}
// Controls
function flap() {
    if (!gameRunning) return;
    bird.velocity = bird.jump * sensitivity;
    createBurst(bird.x + 10, bird.y + bird.h*0.7, 16, 270);
    playJump();
    if (navigator.vibrate) navigator.vibrate(9);
    stats.totalFlaps++;
}
window.addEventListener("keydown", e => { if ((e.code === "Space" || e.code === "ArrowUp") && gameRunning) { e.preventDefault(); flap(); }});
canvas.addEventListener("mousedown", flap);
canvas.addEventListener("touchstart", e => { e.preventDefault(); flap(); }, {passive: false});
let pipeTimer = 0, gameSpeed = 4.2;
function updateBird() {
    bird.velocity += bird.gravity;
    bird.y += bird.velocity;
    bird.rotation = Math.max(-0.75, Math.min(1.6, bird.velocity * 0.085));
    bird.trail.push({x: bird.x + 18, y: bird.y + 18});
    if (bird.trail.length > 16) bird.trail.shift();
}
function updateGame() {
    if (!gameRunning) return;
    timeOfDay = (timeOfDay + 0.00065) % 1;
    stats.playTime += 16;
    updateBird();
    pipeTimer++;
    if (pipeTimer > 78) {
        pipes.push(new Pipe());
        pipeTimer = 0;
        if (score > 40) gameSpeed = Math.min(7.8, 4.2 + (score-40)*0.028);
    }
    for (let i = pipes.length-1; i >= 0; i--) {
        const p = pipes[i];
        p.update(gameSpeed);
        if (p.collides()) { endGame(); return; }
        if (p.x < -200) pipes.splice(i,1);
    }
    for (let i = particles.length-1; i >= 0; i--) {
        particles[i].update();
        if (particles[i].life <= 0) particles.splice(i,1);
    }
    if (bird.y < -30 || bird.y + bird.h > HEIGHT - 95) endGame();
}
function drawBackground() {
    const cycle = timeOfDay;
    let skyTop, skyBot;
    if (cycle < 0.25) { skyTop = `hsl(28, 88%, ${62 + cycle*28}%)`; skyBot = `hsl(200, 70%, 38%)`; }
    else if (cycle < 0.55) { skyTop = `hsl(200, 85%, 68%)`; skyBot = `hsl(210, 65%, 42%)`; }
    else if (cycle < 0.8) { skyTop = `hsl(15, 95%, ${48 + (cycle-0.55)*80}%)`; skyBot = `hsl(240, 50%, 22%)`; }
    else { skyTop = "#0a1428"; skyBot = "#02060f"; }
    const grad = ctx.createLinearGradient(0,0,0,HEIGHT*0.75);
    grad.addColorStop(0, skyTop); grad.addColorStop(1, skyBot);
    ctx.fillStyle = grad; ctx.fillRect(0, 0, WIDTH, HEIGHT);
    if (cycle > 0.78 || cycle < 0.18) {
        ctx.fillStyle = "#fff";
        stars.forEach(s => {
            const tw = Math.sin(timeOfDay*12 + s.twinkle) * 0.6 + 1;
            ctx.globalAlpha = 0.7 + Math.sin(timeOfDay*18 + s.twinkle*2) * 0.3;
            ctx.fillRect(s.x, s.y, s.size*tw, s.size*tw);
        });
        ctx.globalAlpha = 1;
    }
    const sunY = HEIGHT * 0.22 + Math.sin(cycle * Math.PI * 2 - Math.PI/2) * 90;
    if (cycle < 0.7 && cycle > 0.2) {
        ctx.fillStyle = "#fef08c";
        ctx.beginPath(); ctx.arc(WIDTH * 0.72, sunY, 42, 0, Math.PI*2); ctx.fill();
    }
    ctx.fillStyle = cycle > 0.75 ? "#1e2937" : "#334155";
    mountains.forEach(m => {
        ctx.beginPath();
        ctx.moveTo(m.x, HEIGHT - 90);
        ctx.lineTo(m.x + WIDTH*0.22, HEIGHT - 90 - m.height);
        ctx.lineTo(m.x + WIDTH*0.45, HEIGHT - 90);
        ctx.fill();
    });
    ctx.fillStyle = cycle > 0.75 ? "rgba(240,240,255,0.65)" : "rgba(255,255,255,0.75)";
    clouds.forEach(c => {
        c.x -= c.speed * 0.7;
        if (c.x < -400) c.x = WIDTH + 400;
        const cy = c.y + Math.sin(timeOfDay*1.5 + c.x*0.01)*8;
        ctx.globalAlpha = 0.6;
        ctx.fillRect(c.x, cy, 180 * c.size, 52 * c.size);
        ctx.fillRect(c.x + 50, cy - 22, 130 * c.size, 48 * c.size);
    });
    ctx.globalAlpha = 1;
    const groundY = HEIGHT - 92;
    ctx.fillStyle = "#166534"; ctx.fillRect(0, groundY, WIDTH, 110);
    ctx.fillStyle = "#4ade80";
    for (let x = (timeOfDay*80 % 68) - 80; x < WIDTH + 80; x += 68) ctx.fillRect(x, groundY + 18, 34, 28);
}
function drawTrail() {
    ctx.globalAlpha = 0.65;
    bird.trail.forEach((p, i) => {
        ctx.fillStyle = i % 2 === 0 ? "#67e8f9" : "#a5f3fc";
        ctx.fillRect(p.x, p.y, 11 - i*0.6, 11 - i*0.6);
    });
    ctx.globalAlpha = 1;
}
function drawBird() {
    ctx.save();
    ctx.translate(bird.x + bird.w/2, bird.y + bird.h/2);
    ctx.rotate(bird.rotation);
    ctx.fillStyle = "#facc15"; ctx.fillRect(-bird.w/2 + 2, -bird.h/2 + 4, bird.w - 4, bird.h - 8);
    ctx.fillStyle = "#eab308"; ctx.fillRect(-bird.w/2 + 8, -bird.h/2 + 14, 26, 14);
    ctx.fillStyle = "#f97316"; ctx.fillRect(bird.w/2 - 8, -4, 18, 11);
    ctx.fillStyle = "#fff"; ctx.fillRect(-4, -13, 18, 14);
    ctx.fillStyle = "#111"; ctx.fillRect(0, -10, 9, 9);
    ctx.fillStyle = "#fff"; ctx.fillRect(3, -8, 4, 4);
    ctx.restore();
}
function drawGame() {
    ctx.save();
    if (shake > 0) {
        ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
        shake *= 0.86;
    }
    ctx.filter = `brightness(${brightness}%)`;
    drawBackground();
    pipes.forEach(p => p.draw());
    drawTrail();
    drawBird();
    particles.forEach(p => p.draw());
    ctx.restore();
}
function startGame() {
    score = 0; scoreEl.textContent = "0";
    pipes = []; particles = []; bird.trail = [];
    pipeTimer = 0; gameSpeed = 4.2;
    resetBird(); timeOfDay = 0.25;
    homeScreen.classList.add("hidden");
    settingsScreen.classList.add("hidden");
    achievementsScreen.classList.add("hidden");
    statsScreen.classList.add("hidden");
    gameOverScreen.classList.add("hidden");
    gameRunning = true;
    stopBackgroundMusic();
    stats.gamesPlayed++;
    saveData();
}
function endGame() {
    if (!gameRunning) return;
    gameRunning = false;
    playDeath();
    if (score > highScore) highScore = score;
    stats.bestScore = highScore; stats.totalScore += score; stats.totalPipes += score;
    finalScoreEl.textContent = score;
    bestScoreEl.textContent = `BEST: ${highScore}`;
    const breakdown = document.getElementById("scoreBreakdown");
    breakdown.innerHTML = `
        <div class="stat-row"><span>Final Score</span><span><strong>${score}</strong></span></div>
        <div class="stat-row"><span>Pipes Passed</span><span>${score}</span></div>
        <div class="stat-row"><span>Total Games</span><span>${stats.gamesPlayed}</span></div>
    `;
    createBurst(bird.x + 20, bird.y + 18, 46, 0);
    shake = 22;
    saveData();
    gameOverScreen.classList.remove("hidden");
    stopBackgroundMusic();
}
function showStats() {
    const avg = stats.gamesPlayed ? Math.round(stats.totalScore / stats.gamesPlayed) : 0;
    document.getElementById("statsContent").innerHTML = `
        <div class="stat-row"><span>Games Played</span><span>${stats.gamesPlayed}</span></div>
        <div class="stat-row"><span>Total Score</span><span>${stats.totalScore}</span></div>
        <div class="stat-row"><span>Average Score</span><span>${avg}</span></div>
        <div class="stat-row"><span>Best Score</span><span>${highScore}</span></div>
        <div class="stat-row"><span>Total Flaps</span><span>${stats.totalFlaps}</span></div>
        <div class="stat-row"><span>Pipes Passed</span><span>${stats.totalPipes}</span></div>
    `;
}
function setupUI() {
    const tryPlayMusic = () => startBackgroundMusic();
    document.getElementById("startBtn").onclick = () => { playButton(); tryPlayMusic(); startGame(); };
    document.getElementById("restartBtn").onclick = () => { playButton(); startGame(); };
    document.getElementById("homeBtn").onclick = () => {
        playButton();
        gameOverScreen.classList.add("hidden");
        homeScreen.classList.remove("hidden");
        setTimeout(tryPlayMusic, 400);
    };
    document.getElementById("settingsBtn").onclick = () => { playButton(); tryPlayMusic(); homeScreen.classList.add("hidden"); settingsScreen.classList.remove("hidden"); };
    document.getElementById("settingsBackBtn").onclick = () => { playButton(); settingsScreen.classList.add("hidden"); homeScreen.classList.remove("hidden"); };
    document.getElementById("achievementsBtn").onclick = () => { playButton(); tryPlayMusic(); renderAchievements(); homeScreen.classList.add("hidden"); achievementsScreen.classList.remove("hidden"); };
    document.getElementById("achBackBtn").onclick = () => { playButton(); achievementsScreen.classList.add("hidden"); homeScreen.classList.remove("hidden"); };
    document.getElementById("statsBtn").onclick = () => { playButton(); tryPlayMusic(); showStats(); homeScreen.classList.add("hidden"); statsScreen.classList.remove("hidden"); };
    document.getElementById("statsBackBtn").onclick = () => { playButton(); statsScreen.classList.add("hidden"); homeScreen.classList.remove("hidden"); };
    document.getElementById("sensitivity").oninput = e => { sensitivity = +e.target.value; document.getElementById("sensVal").textContent = sensitivity.toFixed(1); };
    document.getElementById("brightness").oninput = e => { brightness = +e.target.value; document.getElementById("brightVal").textContent = brightness; };
    document.getElementById("volume").oninput = e => {
        volume = +e.target.value / 100;
        document.getElementById("volVal").textContent = Math.round(volume*100);
        bgMusic.volume = volume * 0.65;
    };
    document.getElementById("toggleMusic").onclick = function() {
        musicEnabled = !musicEnabled;
        this.textContent = `🎵 MUSIC: ${musicEnabled ? "ON" : "OFF"}`;
        if (musicEnabled) tryPlayMusic();
        else stopBackgroundMusic();
        playButton();
    };
}
function animate() {
    updateGame();
    drawGame();
    requestAnimationFrame(animate);
}
// Init
loadData();
initBackground();
resetBird();
setupUI();
animate();
// Start music on homepage
setTimeout(() => {
    startBackgroundMusic();
    if (!gameRunning) createBurst(WIDTH*0.28, HEIGHT*0.4, 12, 200);
}, 600);
// Extra safety: start on any click
document.addEventListener('click', () => {
    if (!musicStarted) startBackgroundMusic();
}, { once: true });
</script>
